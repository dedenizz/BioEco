<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioEcosystem — Natural Selection & Speciation Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #08090c;
            color: #d1d5db;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 18px;
            display: flex;
            gap: 24px;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(12px);
            padding: 8px 24px;
            border-radius: 6px;
            border: 1px solid #30363d;
            font-size: 0.76rem;
            color: #8b949e;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        #hud span b {
            color: #f0f6fc;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 600;
            margin-left: 4px;
        }
        .season-tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .season-spring { background: #064e3b; color: #6ee7b7; border: 1px solid #047857; }
        .season-summer { background: #713f12; color: #fde047; border: 1px solid #a16207; }
        .season-autumn { background: #7c2d12; color: #fdba74; border: 1px solid #c2410c; }
        .season-winter { background: #1e3a8a; color: #93c5fd; border: 1px solid #1d4ed8; }

        #speciesPanel {
            position: absolute;
            bottom: 18px;
            left: 20px;
            background: rgba(13, 17, 23, 0.88);
            backdrop-filter: blur(10px);
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #30363d;
            font-size: 0.72rem;
            color: #8b949e;
            min-width: 240px;
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .sp-header {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #c9d1d9;
            border-bottom: 1px solid #21262d;
            padding-bottom: 4px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .sp-row {
            display: flex;
            justify-content: space-between;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.72rem;
            margin-bottom: 3px;
        }

        #hint {
            position: absolute;
            bottom: 18px;
            right: 20px;
            font-size: 0.72rem;
            color: #8b949e;
            background: rgba(13, 17, 23, 0.75);
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #21262d;
            pointer-events: none;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #0f141c 0%, #030508 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), inset 0 0 80px rgba(0,0,0,0.85);
            border: 2px solid #21262d;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div id="hud">
        <span>Population: <b id="countPop">0</b></span>
        <span>Taxa: <b id="countSpecies">0</b></span>
        <span><span id="seasonBadge" class="season-tag season-spring">SPRING</span></span>
        <span>Velocity: <b id="avgSpeed">0.00</b></span>
        <span>Sensory Range: <b id="avgSight">0px</b></span>
        <span>Dominant: <b id="domSpecies">None</b></span>
    </div>

    <canvas id="dish" width="700" height="700"></canvas>

    <div id="speciesPanel">
        <div class="sp-header">
            <span>Phylogeny / Active Taxa</span>
            <span>Count</span>
        </div>
        <div id="speciesList"></div>
    </div>

    <div id="hint">Click or drag inside viewport to distribute nutrient clusters</div>

    <script>
        const canvas = document.getElementById('dish');
        const ctx = canvas.getContext('2d');
        const R = canvas.width / 2;
        const CX = R, CY = R;

        let isMouseDown = false;
        let seasonTick = 0;
        const seasons = ['SPRING', 'SUMMER', 'AUTUMN', 'WINTER'];
        let currentSeasonIdx = 0;
        let seasonFoodCap = 80;

        let foods = [];
        let carrion = [];

        function spawnFood(x, y) {
            foods.push({
                x: x || CX + (Math.random() - 0.5) * (R * 1.58),
                y: y || CY + (Math.random() - 0.5) * (R * 1.58),
                r: 2.2,
                eaten: false
            });
        }

        function addCarrion(x, y) {
            if (carrion.length < 30) {
                carrion.push({ x, y, r: 3.0, eaten: false });
            }
        }

        class DNA {
            constructor(parent = null) {
                if (parent) {
                    const delta = (scale) => (Math.random() - 0.5) * scale;
                    this.speed = Math.max(0.6, Math.min(4.8, parent.speed + delta(0.32)));
                    this.sight = Math.max(30, Math.min(220, parent.sight + delta(12)));
                    this.size  = Math.max(3.8, Math.min(12.5, parent.size + delta(0.5)));
                    this.hue   = (parent.hue + delta(18) + 360) % 360;
                    this.diet  = Math.max(0, Math.min(1, parent.diet + delta(0.05)));
                    this.generation = parent.generation + 1;
                    this.speciesId = parent.speciesId;
                    this.founder = parent.founder;
                } else {
                    this.speed = 1.1 + Math.random() * 1.3;
                    this.sight = 45 + Math.random() * 60;
                    this.size  = 4.8 + Math.random() * 2.2;
                    this.diet  = Math.random() < 0.22 ? 0.85 : (Math.random() < 0.32 ? 0.5 : 0.15);
                    this.hue   = this.diet > 0.65 ? 12 : (this.diet < 0.35 ? 160 : 44);
                    this.generation = 1;
                    const tag = this.diet > 0.65 ? 'Apex' : (this.diet < 0.35 ? 'Phyto' : 'Scav');
                    this.speciesId = `${tag}-1`;
                    this.founder = this;
                }
            }

            distanceTo(other) {
                const dSpd = Math.pow((this.speed - other.speed) / 4.0, 2);
                const dSight = Math.pow((this.sight - other.sight) / 180.0, 2);
                const dDiet = Math.pow(this.diet - other.diet, 2) * 2.5;
                return Math.sqrt(dSpd + dSight + dDiet);
            }
        }

        class Phylogeny {
            constructor() {
                this.species = new Map();
                this.nextId = 2;
            }

            register(id, dna) {
                if (!this.species.has(id)) {
                    this.species.set(id, { id, founder: dna, count: 1, hue: dna.hue, gen: dna.generation });
                }
            }

            testSpeciation(dna) {
                const current = this.species.get(dna.speciesId);
                if (current && dna.distanceTo(current.founder) > 0.40) {
                    const prefix = dna.diet > 0.65 ? 'Apex' : (dna.diet < 0.35 ? 'Phyto' : 'Scav');
                    const newId = `${prefix}-${this.nextId++}`;
                    dna.speciesId = newId;
                    dna.founder = dna;
                    this.species.set(newId, { id: newId, founder: dna, count: 1, hue: dna.hue, gen: dna.generation });
                }
            }

            update(creatures) {
                for (let s of this.species.values()) s.count = 0;
                for (let c of creatures) {
                    if (c.alive) {
                        const s = this.species.get(c.dna.speciesId);
                        if (s) s.count++;
                    }
                }
            }

            getActive() {
                return Array.from(this.species.values())
                    .filter(s => s.count > 0)
                    .sort((a, b) => b.count - a.count);
            }
        }
        const phylogeny = new Phylogeny();

        class Creature {
            constructor(x, y, parentDNA = null) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 1.8;
                this.vy = (Math.random() - 0.5) * 1.8;
                this.dna = new DNA(parentDNA);
                phylogeny.testSpeciation(this.dna);
                phylogeny.register(this.dna.speciesId, this.dna);

                this.energy = 90;
                this.alive = true;
                this.tail = [];
                this.niche = this.dna.diet > 0.65 ? 'carnivore' : (this.dna.diet < 0.35 ? 'herbivore' : 'scavenger');
            }

            update(season) {
                const climateBurn = season === 'WINTER' ? 1.35 : 1.0;
                const metabolicRate = (0.042 + (this.dna.speed * 0.03) + (this.dna.size * 0.011)) * climateBurn;
                this.energy -= metabolicRate;

                if (this.energy <= 0) {
                    this.alive = false;
                    addCarrion(this.x, this.y);
                    return;
                }

                let steerX = 0, steerY = 0;
                let hasTarget = false;

                if (this.niche === 'herbivore') {
                    let pred = null, minPred = this.dna.sight * 0.82;
                    let herdX = 0, herdY = 0, herdCount = 0;

                    for (let c of creatures) {
                        if (!c.alive || c === this) continue;
                        const d = Math.hypot(c.x - this.x, c.y - this.y);
                        if (c.niche === 'carnivore' && d < minPred) { minPred = d; pred = c; }
                        else if (c.niche === 'herbivore' && d < 36) {
                            herdX += c.vx; herdY += c.vy; herdCount++;
                        }
                    }

                    if (pred) {
                        steerX = (this.x - pred.x) / minPred;
                        steerY = (this.y - pred.y) / minPred;
                        hasTarget = true;
                    } else {
                        if (herdCount > 0) {
                            steerX += (herdX / herdCount) * 0.18;
                            steerY += (herdY / herdCount) * 0.18;
                        }
                        const food = this.findFood();
                        if (food) {
                            const d = Math.hypot(food.x - this.x, food.y - this.y);
                            steerX = (food.x - this.x) / d;
                            steerY = (food.y - this.y) / d;
                            hasTarget = true;
                            if (d < this.dna.size + food.r) {
                                this.energy = Math.min(210, this.energy + 36);
                                food.eaten = true;
                            }
                        }
                    }
                } else if (this.niche === 'carnivore') {
                    let prey = null, minPrey = this.dna.sight;
                    for (let c of creatures) {
                        if (c.alive && c.niche === 'herbivore') {
                            const d = Math.hypot(c.x - this.x, c.y - this.y);
                            const camo = 1.0 - (Math.abs(c.dna.hue - 215) / 180) * 0.42;
                            const effectiveDist = d / camo;
                            if (effectiveDist < minPrey) { minPrey = effectiveDist; prey = c; }
                        }
                    }

                    if (prey) {
                        steerX = (prey.x - this.x) / minPrey;
                        steerY = (prey.y - this.y) / minPrey;
                        hasTarget = true;
                        if (Math.hypot(prey.x - this.x, prey.y - this.y) < this.dna.size + prey.dna.size) {
                            prey.alive = false;
                            this.energy = Math.min(250, this.energy + 75);
                        }
                    }
                } else {
                    let targetCarrion = null, minC = this.dna.sight * 1.1;
                    for (let cr of carrion) {
                        const d = Math.hypot(cr.x - this.x, cr.y - this.y);
                        if (d < minC) { minC = d; targetCarrion = cr; }
                    }
                    if (targetCarrion) {
                        steerX = (targetCarrion.x - this.x) / minC;
                        steerY = (targetCarrion.y - this.y) / minC;
                        hasTarget = true;
                        if (minC < this.dna.size + targetCarrion.r) {
                            this.energy = Math.min(190, this.energy + 32);
                            targetCarrion.eaten = true;
                        }
                    }
                }

                if (hasTarget) {
                    this.vx += steerX * 0.15;
                    this.vy += steerY * 0.15;
                } else {
                    this.vx += (Math.random() - 0.5) * 0.22;
                    this.vy += (Math.random() - 0.5) * 0.22;
                }

                const spd = Math.hypot(this.vx, this.vy);
                if (spd > 0) {
                    this.vx = (this.vx / spd) * this.dna.speed;
                    this.vy = (this.vy / spd) * this.dna.speed;
                }

                this.x += this.vx;
                this.y += this.vy;

                const dCenter = Math.hypot(this.x - CX, this.y - CY);
                if (dCenter > R - this.dna.size - 8) {
                    const ang = Math.atan2(this.y - CY, this.x - CX);
                    this.vx -= Math.cos(ang) * 0.42;
                    this.vy -= Math.sin(ang) * 0.42;
                }

                this.tail.unshift({ x: this.x, y: this.y });
                if (this.tail.length > 5) this.tail.pop();
            }

            findFood() {
                let closest = null, minD = this.dna.sight;
                for (let f of foods) {
                    const d = Math.hypot(f.x - this.x, f.y - this.y);
                    if (d < minD) { minD = d; closest = f; }
                }
                return closest;
            }

            canDivide() {
                return this.energy >= (this.niche === 'carnivore' ? 180 : 135);
            }

            divide() {
                this.energy *= 0.5;
                return new Creature(
                    this.x + (Math.random() - 0.5) * 8,
                    this.y + (Math.random() - 0.5) * 8,
                    this.dna
                );
            }

            draw() {
                ctx.save();
                for (let i = 0; i < this.tail.length; i++) {
                    const p = this.tail[i];
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, this.dna.size * (1 - i / 7) * 0.75, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.dna.hue}, 70%, 50%, ${0.2 - i * 0.03})`;
                    ctx.fill();
                }

                ctx.translate(this.x, this.y);
                const angle = Math.atan2(this.vy, this.vx);
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.arc(0, 0, this.dna.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.dna.hue}, 75%, 52%)`;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 0.8;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, this.dna.size * 0.38, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.restore();
            }
        }

        let creatures = [];

        function init() {
            creatures = [];
            foods = [];
            carrion = [];
            for (let i = 0; i < 28; i++) {
                creatures.push(new Creature(
                    CX + (Math.random() - 0.5) * (R * 1.2),
                    CY + (Math.random() - 0.5) * (R * 1.2)
                ));
            }
            for (let i = 0; i < 45; i++) spawnFood();
        }
        init();

        canvas.addEventListener('mousedown', e => { isMouseDown = true; feed(e); });
        window.addEventListener('mouseup', () => isMouseDown = false);
        canvas.addEventListener('mousemove', e => { if (isMouseDown) feed(e); });

        function feed(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            if (Math.hypot(x - CX, y - CY) < R - 15) {
                for (let i = 0; i < 3; i++) spawnFood(x + (Math.random() - 0.5) * 16, y + (Math.random() - 0.5) * 16);
            }
        }

        function loop() {
            seasonTick++;
            if (seasonTick > 900) {
                seasonTick = 0;
                currentSeasonIdx = (currentSeasonIdx + 1) % seasons.length;
                const sName = seasons[currentSeasonIdx];
                const bEl = document.getElementById('seasonBadge');
                bEl.textContent = sName;
                bEl.className = `season-tag season-${sName.toLowerCase()}`;
                seasonFoodCap = sName === 'WINTER' ? 25 : (sName === 'SPRING' ? 95 : 65);
            }
            const activeSeason = seasons[currentSeasonIdx];

            ctx.fillStyle = 'rgba(8, 9, 12, 0.36)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const spawnRate = activeSeason === 'WINTER' ? 0.05 : 0.22;
            if (foods.length < seasonFoodCap && Math.random() < spawnRate) spawnFood();

            ctx.fillStyle = '#10b981';
            for (let f of foods) {
                ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
            }

            ctx.fillStyle = '#92400e';
            for (let cr of carrion) {
                ctx.beginPath(); ctx.arc(cr.x, cr.y, cr.r, 0, Math.PI * 2); ctx.fill();
            }

            const newborns = [];
            let totalSpd = 0, totalSight = 0;

            for (let c of creatures) {
                c.update(activeSeason);
                c.draw();
                if (c.alive) {
                    totalSpd += c.dna.speed;
                    totalSight += c.dna.sight;
                    if (c.canDivide() && creatures.length < 80) newborns.push(c.divide());
                }
            }

            creatures = creatures.filter(c => c.alive);
            creatures.push(...newborns);
            foods = foods.filter(f => !f.eaten);
            carrion = carrion.filter(cr => !cr.eaten);

            if (creatures.length < 4) {
                for (let i = 0; i < 4; i++) {
                    creatures.push(new Creature(CX + (Math.random() - 0.5) * 50, CY + (Math.random() - 0.5) * 50));
                }
            }

            phylogeny.update(creatures);
            const activeSpecies = phylogeny.getActive();
            const n = creatures.length || 1;

            document.getElementById('countPop').textContent = creatures.length;
            document.getElementById('countSpecies').textContent = activeSpecies.length;
            document.getElementById('avgSpeed').textContent = (totalSpd / n).toFixed(2);
            document.getElementById('avgSight').textContent = (totalSight / n).toFixed(0) + 'px';
            document.getElementById('domSpecies').textContent = activeSpecies[0] ? activeSpecies[0].id : 'None';

            const listEl = document.getElementById('speciesList');
            listEl.innerHTML = activeSpecies.slice(0, 4).map(sp => 
                `<div class="sp-row">
                    <span style="color: hsl(${sp.hue}, 80%, 65%);">${sp.id} (G${sp.gen})</span>
                    <span>${sp.count}</span>
                 </div>`
            ).join('');

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
